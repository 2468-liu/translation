<!doctype html>
<meta charset="utf-8" />
<title>实时字幕翻译</title>
<style>
  body {
    margin: 0;
    width: 360px;
    font: 14px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #28241d;
    background: #fbf8ff;
  }
  main {
    padding: 12px 14px 14px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }
  p {
    margin: 4px 0 12px;
    color: #777067;
    font-size: 12px;
  }
  label {
    display: block;
    margin-bottom: 7px;
  }
  select, button, input[type="text"], input[type="password"], input[type="range"] {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
  }
  select, input[type="text"], input[type="password"] {
    margin-bottom: 10px;
    padding: 8px 10px;
    border: 1px solid #d6cfc5;
    border-radius: 10px;
    background: #fff;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 10px;
    background: #806900;
    color: white;
    cursor: pointer;
  }
  button.stop {
    background: #9a4d3d;
  }
  button.secondary {
    margin-top: 8px;
    background: #31424a;
  }
  .media-card {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 12px;
    margin: 0 -2px 14px;
    border-radius: 14px;
    background: #f2ede8;
  }
  .media-art {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: #d9c8a7;
    color: #fff;
    font-size: 22px;
  }
  .media-title {
    margin: 0;
    overflow: hidden;
    font-weight: 650;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .media-subtitle {
    margin: 2px 0 0;
    color: #756d64;
    font-size: 12px;
  }
  .section {
    padding: 10px 2px 12px;
    border-top: 1px solid #e6dcae;
  }
  .section-title {
    margin: 0 0 9px;
    font-size: 14px;
    font-weight: 700;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 9px 0;
  }
  .setting-row label {
    margin: 0;
  }
  .switch {
    width: 40px;
    height: 22px;
    margin: 0;
    accent-color: #806900;
  }
  #fontColor {
    width: 100%;
    height: 24px;
    padding: 0;
    border: 1px solid #d6cfc5;
    border-radius: 12px;
    background: linear-gradient(90deg, #ffffff, #f4d35e, #ef8354, #d1495b, #7b2cbf, #0077b6, #2a9d8f, #1f2937);
    cursor: pointer;
  }
  /* One slider rather than two buttons.
     250 and 750 were the only two values ever offered and both were measured on
     samples/blog_3min.wav, but the hold work showed the useful range is continuous:
     the caption floor binds below 620ms and nothing binds above 1000ms because the
     reference table tops out at 4200. Offering a continuum lets the next reader use
     what was measured instead of re-picking from a menu of two. */
  .cadence {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
  }
  .cadence output {
    font-variant-numeric: tabular-nums;
    color: #4a443b;
    min-width: 5.5ch;
    text-align: right;
  }
  .hint {
    margin: 6px 0 0;
    color: #777067;
    font-size: 12px;
  }
  #status {
    min-height: 1.2em;
    margin-top: 10px;
    color: #6c645b;
    font-size: 12px;
  }
  /* A failure has to survive. The status line used to be reset to 未开始 by the
     refresh that ran in the same finally block, so every error was erased a few
     milliseconds after it appeared -- indistinguishable from a dead button. */
  #status.error {
    color: #9a2f22;
    font-weight: 600;
  }
</style>
<main>
  <div class="media-card">
    <div class="media-art">字幕</div>
    <div>
      <h1>实时字幕翻译</h1>
      <p class="media-subtitle">本地识别 · 系统回环 · 不修改网页</p>
    </div>
    <span id="mediaState">●</span>
  </div>
  <div class="section">
    <p class="section-title">字幕显示</p>
    <div class="setting-row"><label for="textOnly">只有字，不要背景</label><input class="switch" id="textOnly" type="checkbox" /></div>
    <p class="hint" id="captionStateHint"></p>
    <div class="setting-row"><label for="audioOnly">仅音频，不显示字幕</label><input class="switch" id="audioOnly" type="checkbox" /></div>
    <label for="fontSize">字号 <span id="fontSizeValue">20</span></label>
    <input id="fontSize" type="range" min="16" max="40" step="1" value="20" />
    <label for="fontColor">字幕颜色</label>
    <input id="fontColor" type="color" value="#ffffff" title="选择字幕颜色" />
    <label for="cadenceSlider">改口节奏 <span id="cadenceValue">750</span> 毫秒</label>
    <div class="cadence">
      <input id="cadenceSlider" type="range" min="250" max="1000" step="50" value="750" />
      <output id="cadenceReadout" for="cadenceSlider">750</output>
    </div>
    <p class="hint" id="cadenceHint">识别中途每隔多久回一次字幕。小改口多但跟得紧，大改口少但首句更晚。</p>
  </div>
  <div class="section">
    <p class="section-title">识别线路</p>
    <label for="chainSelect">线路</label>
    <select id="chainSelect">
      <option value="whisper-hy">whisper 识别 + 混元翻译（默认，端到端最快）</option>
      <option value="qwen3-hy">Qwen3-ASR 识别 + 混元翻译（识别快 5.9 倍，但改口多 2.9 倍）</option>
      <option value="gemma-e2e">音频直出 Gemma4 E2B（实测：干净旁白可用，对白压在配乐下会崩）</option>
    </select>
    <p class="hint" id="chainHint">切换会重启后端，大约 10 秒；字幕会中断一下。切不过去会自动回退。</p>
  </div>
  <div class="section">
    <p class="section-title">翻译设置</p>
  <label><input id="apiEnabled" type="checkbox" /> 用外部接口翻译</label>
  <div id="apiFields" hidden>
    <label for="apiUrl">接口地址</label>
    <input id="apiUrl" type="text" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false" />
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="没有密钥就留空" autocomplete="off" />
    <label for="apiModel">模型名</label>
    <input id="apiModel" type="text" placeholder="例如 gemini-2.0-flash" autocomplete="off" spellcheck="false" />
    <p>地址填到 /v1 即可，请求发往 /chat/completions。识别仍在本机。</p>
  </div>
  <label for="language">语言</label>
  <select id="language">
    <option value="auto">自动检测</option>
    <option value="en">英语</option>
    <option value="ja">日语</option>
    <option value="ko">韩语</option>
    <option value="fr">法语</option>
    <option value="de">德语</option>
    <option value="es">西班牙语</option>
    <option value="ru">俄语</option>
  </select>
  </div>
  <button id="toggle" type="button">开始</button>
  <div id="status"></div>
</main>
<script src="popup.js"></script>
