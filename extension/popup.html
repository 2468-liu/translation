<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时字幕翻译</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --surface-variant: #f1f3f4;
      --border: #dadce0;
      --text: #202124;
      --text-secondary: #5f6368;
      --text-tertiary: #80868b;
      --primary: #1a73e8;
      --primary-hover: #1557d0;
      --primary-bg: #e8f0fe;
      --danger: #d93025;
      --danger-hover: #b31412;
      --danger-bg: #fce8e6;
      --success: #1e8e3e;
      --success-bg: #e6f4ea;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #292a2d;
        --surface-variant: #35363a;
        --border: #444746;
        --text: #e8eaed;
        --text-secondary: #9aa0a6;
        --text-tertiary: #80868b;
        --primary: #8ab4f8;
        --primary-hover: #aecbfa;
        --primary-bg: #1c2b46;
        --danger: #f28b82;
        --danger-hover: #f6aea9;
        --danger-bg: #442726;
        --success: #81c995;
        --success-bg: #1e3a29;
      }
    }
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    body {
      margin: 0;
      width: 340px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      user-select: none;
    }
    main {
      padding: 16px;
    }

    /* Top Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--primary-bg);
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.1px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface-variant);
      color: var(--text-secondary);
    }
    .badge.active {
      background: var(--success-bg);
      color: var(--success);
    }
    #mediaState {
      font-size: 8px;
    }

    /* Primary Action */
    .action-container {
      margin-bottom: 14px;
    }
    #toggle {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    #toggle:hover {
      background: var(--primary-hover);
    }
    #toggle:active {
      transform: scale(0.99);
    }
    #toggle.stop {
      background: var(--danger);
    }
    #toggle.stop:hover {
      background: var(--danger-hover);
    }
    #toggle:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Section & Cards */
    .group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .group:last-of-type {
      border-bottom: none;
      margin-bottom: 8px;
      padding-bottom: 0;
    }
    .group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 8px;
    }

    /* Form Rows */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      margin: 6px 0;
    }
    .row-label {
      font-size: 13px;
      color: var(--text);
    }
    .row-value {
      font-size: 12px;
      font-weight: 500;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    /* Native Material Switch */
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--primary);
    }

    /* Form Controls */
    select, input[type="text"], input[type="password"] {
      width: 100%;
      height: 32px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font: inherit;
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    label {
      display: block;
      margin: 6px 0 3px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Sliders */
    input[type="range"] {
      width: 100%;
      height: 4px;
      margin: 6px 0;
      background: var(--surface-variant);
      border-radius: 2px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .cadence {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .cadence output {
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 4.5ch;
      text-align: right;
    }

    /* Color Palette */
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .color-presets {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.12s;
    }
    .color-dot:hover {
      transform: scale(1.2);
    }
    #fontColor {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
    }

    /* Help Text & Details */
    .hint {
      margin: 3px 0 0;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    /* Status Banner */
    #status {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      margin-top: 10px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.35;
    }
    #status.error {
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 500;
    }

    /* Hidden Compatibility Elements */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
<main>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">译</div>
      <div class="brand-title">实时字幕与翻译</div>
    </div>
    <div class="badge" id="stateBadge">
      <span id="mediaState">●</span>
      <span id="stateText">就绪</span>
    </div>
  </div>

  <!-- Primary Action -->
  <div class="action-container">
    <button id="toggle" type="button">开启实时字幕</button>
  </div>

  <!-- Language Selection -->
  <div class="group">
    <div class="group-title">识别语种</div>
    <select id="language">
      <option value="auto">自动检测 (默认)</option>
      <option value="ja">日语 (日本語) — 锁定识别，消除误判</option>
      <option value="en">英语 (English)</option>
      <option value="ko">韩语 (한국어)</option>
      <option value="zh">中文 (普通话)</option>
      <option value="fr">法语 (Français)</option>
      <option value="de">德语 (Deutsch)</option>
      <option value="es">西班牙语 (Español)</option>
      <option value="ru">俄语 (Русский)</option>
    </select>
    <p class="hint">选择具体语种可直接注入语言引导，显著提高专业词汇与小语种准确度。</p>
  </div>

  <!-- Subtitle Window Appearance -->
  <div class="group">
    <div class="group-title">字幕显示</div>
    
    <div class="row">
      <span class="row-label">透明悬浮 (仅文字)</span>
      <input class="switch" id="textOnly" type="checkbox" />
    </div>
    <p class="hint" id="captionStateHint"></p>

    <div class="row" style="margin-top: 8px;">
      <span class="row-label">字号</span>
      <span class="row-value"><span id="fontSizeValue">20</span> px</span>
    </div>
    <input id="fontSize" type="range" min="16" max="40" step="1" value="20" />

    <div class="row" style="margin-top: 4px;">
      <span class="row-label">颜色</span>
      <div class="color-row">
        <div class="color-presets">
          <span class="color-dot" style="background:#ffffff;" data-color="#ffffff" title="纯白"></span>
          <span class="color-dot" style="background:#fef08a;" data-color="#fef08a" title="淡黄"></span>
          <span class="color-dot" style="background:#7dd3fc;" data-color="#7dd3fc" title="天蓝"></span>
          <span class="color-dot" style="background:#86efac;" data-color="#86efac" title="浅绿"></span>
          <span class="color-dot" style="background:#fca5a5;" data-color="#fca5a5" title="粉红"></span>
        </div>
        <input id="fontColor" type="color" value="#ffffff" title="自定义颜色" />
      </div>
    </div>

    <div class="row" style="margin-top: 6px;">
      <span class="row-label">刷新节奏</span>
      <span class="row-value"><span id="cadenceValue">750</span> ms</span>
    </div>
    <div class="cadence">
      <input id="cadenceSlider" type="range" min="250" max="1000" step="50" value="750" />
      <output id="cadenceReadout" for="cadenceSlider">750</output>
    </div>
    <p class="hint" id="cadenceHint">默认 750ms。跟进及时且避免频繁改口。</p>

    <div class="row" style="margin-top: 8px;">
      <span class="row-label">静音自动隐去</span>
      <span class="row-value" id="dismissValue">5 秒</span>
    </div>
    <div class="cadence">
      <input id="dismissSlider" type="range" min="0" max="15" step="1" value="5" />
      <output id="dismissReadout" for="dismissSlider">5s</output>
    </div>
    <p class="hint" id="dismissHint">静音 5 秒后自动隐去字幕，防止无声场景或切换视频时残留。</p>
  </div>

  <!-- Advanced Settings -->
  <div class="group">
    <div class="row">
      <span class="row-label" style="font-size:12px; color:var(--text-secondary);">使用外部大模型翻译</span>
      <input class="switch" id="apiEnabled" type="checkbox" />
    </div>
    <div id="apiFields" hidden>
      <label for="apiUrl">接口地址</label>
      <input id="apiUrl" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false" />
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
      <label for="apiModel">模型名称</label>
      <input id="apiModel" type="text" placeholder="gpt-4o-mini / gemini-2.5" autocomplete="off" spellcheck="false" />
    </div>

    <div class="row" style="margin-top: 6px;">
      <span class="row-label" style="font-size:12px; color:var(--text-secondary);">仅音频诊断模式</span>
      <input class="switch" id="audioOnly" type="checkbox" />
    </div>
  </div>

  <!-- Status readout -->
  <div id="status">未开始</div>

  <!-- Hidden elements preserving automated test interfaces -->
  <div class="sr-only">
    <select id="chainSelect">
      <option value="qwen3-hy" selected>Qwen3-ASR 识别 + 混元翻译（主力；块输出·按标点分块）</option>
      <option value="whisper-hy">whisper 识别 + 混元翻译（回退；流式字幕）</option>
      <option value="gemma-e2e">音频直出 Gemma4 E2B（对白压在配乐下会崩；流式字幕）</option>
    </select>
    <span id="chainHint"></span>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
