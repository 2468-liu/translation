<!doctype html>
<meta charset="utf-8" />
<title>实时字幕翻译</title>
<style>
  body {
    margin: 0;
    width: 300px;
    font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1c1c1c;
    background: #f4f5f6;
  }
  main {
    padding: 14px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 650;
  }
  p {
    margin: 0 0 12px;
    color: #555;
  }
  label {
    display: block;
    margin-bottom: 4px;
  }
  select, button, input[type="text"], input[type="password"], input[type="range"] {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
  }
  select, input[type="text"], input[type="password"], input[type="range"] {
    margin-bottom: 10px;
    padding: 6px;
    border: 1px solid #c5c8cb;
    border-radius: 4px;
    background: white;
  }
  button {
    border: 0;
    padding: 8px 10px;
    background: #176b4a;
    color: white;
    cursor: pointer;
  }
  button.stop {
    background: #8a3b2c;
  }
  button.secondary {
    margin-top: 8px;
    background: #31424a;
  }
  #status {
    min-height: 1.2em;
    margin-top: 10px;
    color: #444;
  }
</style>
<main>
  <h1>实时字幕翻译</h1>
  <p>点开始自动启动本地服务。字幕窗 X 只关闭字幕，终止后端才释放模型；重新开始时模型需要重新加载。</p>
  <label><input id="textOnly" type="checkbox" checked /> 只有字，不要背景</label>
  <label for="fontSize">字号 <span id="fontSizeValue">20</span></label>
  <input id="fontSize" type="range" min="16" max="40" step="1" value="20" />
  <label><input id="apiEnabled" type="checkbox" /> 用外部接口翻译</label>
  <div id="apiFields" hidden>
    <label for="apiUrl">接口地址</label>
    <input id="apiUrl" type="text" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false" />
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="没有密钥就留空" autocomplete="off" />
    <label for="apiModel">模型名</label>
    <input id="apiModel" type="text" placeholder="例如 gemini-2.0-flash" autocomplete="off" spellcheck="false" />
    <p>地址填到 /v1 即可，请求发往 /chat/completions。识别仍在本机。</p>
  </div>
  <label for="language">语言</label>
  <select id="language">
    <option value="auto">自动检测</option>
    <option value="en">英语</option>
    <option value="ja">日语</option>
    <option value="ko">韩语</option>
    <option value="fr">法语</option>
    <option value="de">德语</option>
    <option value="es">西班牙语</option>
    <option value="ru">俄语</option>
  </select>
  <button id="toggle" type="button">开始</button>
  <button id="show" class="secondary" type="button" hidden>找到字幕</button>
  <div id="status"></div>
</main>
<script src="popup.js"></script>
